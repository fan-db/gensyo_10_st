<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>テルミナライン配信DB</title>
<style>
  :root {
    --bg: #0e0908;
    --panel: #1a1210;
    --border: #3a221a;
    --text: #f2e6df;
    --text-dim: #b89a8c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 16px;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
  }
  h1 {
    text-align: center;
    margin-bottom: 32px;
  }
  .db-list {
    max-width: 600px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .db-card {
    display: block;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    text-decoration: none;
    color: var(--text);
    transition: border-color 0.15s;
  }
  .db-card:hover {
    border-color: var(--card-accent, var(--text-dim));
  }
  .db-card .accent-bar {
    height: 4px;
    border-radius: 4px;
    margin-bottom: 12px;
    background: var(--card-gradient);
  }
  .db-card .db-title {
    font-size: 1.1rem;
    font-weight: bold;
  }
</style>
</head>
<body>

<h1>テルミナライン配信DB</h1>
<div class="db-list" id="db-list"></div>

<script src="config.js"></script>
<script>
  const list = document.getElementById('db-list');

  Object.entries(DATABASES).forEach(([id, db]) => {
    const a = document.createElement('a');
    a.href = `database.html?id=${encodeURIComponent(id)}`;
    a.className = 'db-card';
    a.style.setProperty('--card-gradient', `linear-gradient(90deg, ${db.theme.fireA}, ${db.theme.fireB})`);
    a.style.setProperty('--card-accent', db.theme.fireA);

    a.innerHTML = `
      <div class="accent-bar"></div>
      <div class="db-title">${db.title}</div>
    `;
    list.appendChild(a);
  });
</script>

</body>
</html>
