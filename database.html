<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title id="page-title">データベース</title>
<style>
  :root {
    /* デフォルト値。JSでconfigのthemeに応じて上書きされる */
    --bg: #0e0908;
    --panel: #1a1210;
    --border: #3a221a;
    --text: #f2e6df;
    --text-dim: #b89a8c;
    --fire-a: #ff7a1a;
    --fire-b: #ff2d2d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 60px;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
  }
  h1 {
    text-align: center;
    font-size: 1.8rem;
    margin-bottom: 16px;
    background: linear-gradient(90deg, var(--fire-a), var(--fire-b));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 18px rgba(255, 90, 20, 0.35);
  }
  .back-link {
    display: block;
    text-align: center;
    margin-bottom: 20px;
    color: var(--text-dim);
    text-decoration: none;
    font-size: 0.85rem;
  }
  .back-link:hover { color: var(--fire-a); }

  .external-links {
    display: flex;
    justify-content: center;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }
  .external-links a {
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 8px 18px;
    border-radius: 8px;
    text-decoration: none;
    font-size: 0.9rem;
  }
  .external-links a:hover {
    border-color: var(--fire-a);
    color: var(--fire-a);
  }

  .panel {
    max-width: 900px;
    margin: 0 auto 20px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
  }
  .panel-title { font-weight: bold; margin-bottom: 10px; color: var(--fire-a); }
  .checkbox-list { display: flex; flex-wrap: wrap; gap: 10px 18px; }
  .checkbox-list label { display: flex; align-items: center; gap: 6px; font-size: 0.95rem; cursor: pointer; }
  .checkbox-list input[type="checkbox"] { accent-color: var(--fire-b); width: 16px; height: 16px; }
  .select-all { border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 10px; font-weight: bold; }

  .table-header {
    display: flex; justify-content: space-between; align-items: center;
    max-width: 900px; margin: 0 auto 10px;
  }
  .toggle-btn {
    background: linear-gradient(90deg, var(--fire-a), var(--fire-b));
    border: none; color: #fff; padding: 8px 16px; border-radius: 8px;
    cursor: pointer; font-size: 0.9rem;
  }
  .table-wrap {
    max-width: 900px; margin: 0 auto; overflow-x: auto;
    border: 1px solid var(--border); border-radius: 12px;
  }
  table { width: auto; min-width: 100%; border-collapse: collapse; background: var(--panel); }
  th, td { padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; font-size: 0.9rem; }
  th { color: var(--fire-a); text-align: left; background: #221512; }
  tr:hover td { background: #241512; }
  .hidden-col { display: none; }
  .empty-msg { text-align: center; color: var(--text-dim); padding: 30px 0; }
  a { color: var(--fire-a); }
</style>
</head>
<body>

<a href="index.html" class="back-link">← 一覧に戻る</a>
<h1 id="title-text"></h1>

<div class="external-links" id="external-links"></div>

<div class="panel">
  <div class="panel-title">表示する配信を選んでね</div>
  <div class="checkbox-list">
    <label class="select-all"><input type="checkbox" id="select-all"> すべて表示</label>
  </div>
  <div class="checkbox-list" id="dist-checkboxes"></div>
</div>

<div class="table-header">
  <span style="color:var(--text-dim); font-size:0.9rem;">表示中の配信のみ一覧に出ます</span>
  <button class="toggle-btn" id="toggle-hidden">ネタバレを表示</button>
</div>

<div class="table-wrap">
  <table id="char-table">
    <thead><tr id="table-head"></tr></thead>
    <tbody id="table-body"></tbody>
  </table>
</div>

<p class="empty-msg" id="empty-msg">配信を選ぶと表示されます</p>

<script src="config.js"></script>
<script>
let HEADERS = [];
let ROWS = [];
let checkedDist = new Set();
let showHidden = false;
let DB;

function applyTheme(theme) {
  const root = document.documentElement.style;
  root.setProperty('--bg', theme.bg);
  root.setProperty('--panel', theme.panel);
  root.setProperty('--border', theme.border);
  root.setProperty('--text', theme.text);
  root.setProperty('--text-dim', theme.textDim);
  root.setProperty('--fire-a', theme.fireA);
  root.setProperty('--fire-b', theme.fireB);
}

function renderExternalLinks(db) {
  const container = document.getElementById('external-links');
  if (db.boothUrl) {
    const a = document.createElement('a');
    a.href = db.boothUrl;
    a.target = '_blank';
    a.textContent = db.boothText || 'シナリオはこちら→';
    container.appendChild(a);
  }
  if (db.youtubeUrl) {
    const a = document.createElement('a');
    a.href = db.youtubeUrl;
    a.target = '_blank';
    a.textContent = db.youtubeText || '配信アーカイブはこちら→';
    container.appendChild(a);
  }
}

async function init() {
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  DB = DATABASES[id];

  if (!DB) {
    document.getElementById('title-text').textContent = 'ページが見つかりません';
    document.getElementById('empty-msg').textContent =
      'URLのid指定が正しくありません。一覧ページからアクセスしてください。';
    return;
  }

  applyTheme(DB.theme);
  document.title = DB.title;
  document.getElementById('title-text').textContent = DB.title;
  document.getElementById('page-title').textContent = DB.title;
  renderExternalLinks(DB);

  try {
    const apiUrl = new URL(GAS_URL);
    apiUrl.searchParams.append("sheet", DB.sheetName);

    const res = await fetch(apiUrl.toString(), {
      method: "GET",
      redirect: "follow"
    });

    if (!res.ok) throw new Error(`HTTPエラー: ${res.status}`);
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    
    HEADERS = data.headers;
    ROWS = data.rows;
    renderCheckboxes();
    renderTable();
  } catch (err) {
    document.getElementById('empty-msg').textContent = 'データの取得に失敗しました: ' + err.message;
    console.error(err);
  }
}

function renderCheckboxes() {
  const container = document.getElementById('dist-checkboxes');
  const seen = new Set();
  const uniqueValues = [];
  ROWS.forEach(row => {
    const v = row[DB.distColIndex];
    if (v && !seen.has(v)) { seen.add(v); uniqueValues.push(v); }
  });

  uniqueValues.forEach(value => {
    const label = document.createElement('label');
    const input = document.createElement('input');
    input.type = 'checkbox';
    input.value = value;
    input.addEventListener('change', () => {
      if (input.checked) checkedDist.add(value); else checkedDist.delete(value);
      syncSelectAll();
      renderTable();
    });
    label.appendChild(input);
    label.appendChild(document.createTextNode(value));
    container.appendChild(label);
  });

  document.getElementById('select-all').addEventListener('change', (e) => {
    const all = container.querySelectorAll('input[type="checkbox"]');
    all.forEach(cb => {
      cb.checked = e.target.checked;
      if (e.target.checked) checkedDist.add(cb.value); else checkedDist.delete(cb.value);
    });
    renderTable();
  });
}

function syncSelectAll() {
  const container = document.getElementById('dist-checkboxes');
  const all = container.querySelectorAll('input[type="checkbox"]');
  document.getElementById('select-all').checked = [...all].every(cb => cb.checked);
}

function renderTable() {
  const head = document.getElementById('table-head');
  const body = document.getElementById('table-body');
  const emptyMsg = document.getElementById('empty-msg');
  head.innerHTML = '';
  body.innerHTML = '';

  const hiddenStart = HEADERS.length - DB.hiddenColumnCount;

  HEADERS.forEach((h, i) => {
    const th = document.createElement('th');
    th.textContent = h;
    if (i >= hiddenStart && !showHidden) th.classList.add('hidden-col');
    head.appendChild(th);
  });

  const visibleRows = ROWS.filter(row => checkedDist.has(row[DB.distColIndex]));
  emptyMsg.style.display = visibleRows.length === 0 ? 'block' : 'none';

  visibleRows.forEach(row => {
    const tr = document.createElement('tr');
    row.forEach((cell, i) => {
      const td = document.createElement('td');
      if (typeof cell === 'string' && cell.startsWith('http')) {
        const a = document.createElement('a');
        a.href = cell; a.textContent = 'リンク'; a.target = '_blank';
        td.appendChild(a);
      } else {
        td.textContent = cell;
      }
      if (i >= hiddenStart && !showHidden) td.classList.add('hidden-col');
      tr.appendChild(td);
    });
    body.appendChild(tr);
  });
}

document.getElementById('toggle-hidden').addEventListener('click', (e) => {
  showHidden = !showHidden;
  e.target.textContent = showHidden ? 'ネタバレを隠す' : 'ネタバレを表示';
  renderTable();
});

init();
</script>
</body>
</html>
