<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title id="page-title">データベース</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;500;800;900&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* ダーク基調は固定。ここは全シナリオ共通 */
    --bg: #0e0908;
    --panel: #1a1210;
    --border: #3a221a;
    --text: #f2e6df;
    --text-dim: #b89a8c;
  }
  body {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    background: var(--bg);
    color: var(--text);
  }
  h1.fire-title {
    background: linear-gradient(90deg, var(--fire-a), var(--fire-b));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 18px rgba(255, 90, 20, 0.25);
  }
  tr:hover td { background: #241512 !important; }
</style>
</head>
<body class="antialiased min-h-screen">

<div class="max-w-4xl mx-auto px-4 py-6 sm:py-8">

  <a href="index.html" class="inline-block text-xs text-[var(--text-dim)] hover:text-accent-400 mb-4 transition-colors">← 一覧に戻る</a>

  <header class="mb-6 pb-5 border-b border-[var(--border)]" id="page-header"></header>

  <div class="flex items-center gap-3 mb-6 text-xs" id="external-links"></div>

  <div class="bg-[var(--panel)] border border-[var(--border)] rounded-2xl p-4 mb-6">
    <div class="font-bold text-accent-400 mb-3 text-sm">表示する配信を選んでね</div>
    <div class="flex flex-wrap gap-x-5 gap-y-2 text-sm">
      <label class="flex items-center gap-1.5 font-bold border-b border-[var(--border)] pb-2 mb-1 w-full cursor-pointer text-[var(--text)]">
        <input type="checkbox" id="select-all" class="accent-accent-500 w-4 h-4"> すべて表示
      </label>
    </div>
    <div class="flex flex-wrap gap-x-5 gap-y-2 text-sm mt-2 text-[var(--text)]" id="dist-checkboxes"></div>
  </div>

  <div class="flex items-center justify-between mb-3">
    <span class="text-xs text-[var(--text-dim)]">表示中の配信のみ一覧に出ます</span>
    <button id="toggle-hidden" class="text-white text-xs font-bold px-4 py-2 rounded-xl shadow-sm" style="background: var(--accent-btn-bg);">ネタバレを表示</button>
  </div>

  <div class="bg-[var(--panel)] border border-[var(--border)] rounded-2xl overflow-hidden">
    <div class="overflow-x-auto">
      <table class="text-left border-collapse" style="width:auto; min-width:100%;">
        <thead><tr id="table-head" class="border-b border-[var(--border)] text-xs font-bold text-accent-400"></tr></thead>
        <tbody id="table-body" class="divide-y divide-[var(--border)] text-sm text-[var(--text)]"></tbody>
      </table>
    </div>
  </div>

  <p class="text-center text-[var(--text-dim)] text-sm py-8" id="empty-msg">配信を選ぶと表示されます</p>

</div>

<script src="config.js"></script>
<script>
let HEADERS = [], ROWS = [], checkedDist = new Set(), showHidden = false, DB;

function applyAccentTheme(accent) {
  tailwind.config = {
    theme: { extend: { colors: { accent } } }
  };
  document.documentElement.style.setProperty('--fire-a', accent[400]);
  document.documentElement.style.setProperty('--fire-b', accent[600]);
  document.documentElement.style.setProperty('--accent-btn-bg', `linear-gradient(90deg, ${accent[400]}, ${accent[600]})`);
}

function renderHeader(db) {
  document.getElementById('page-header').innerHTML = `
    <div class="flex items-center gap-1">
      <span class="text-2xl inline-block transform rotate-[-12deg] select-none w-8 text-center">${db.emoji || '🔥'}</span>
      <h1 class="fire-title text-xl sm:text-2xl font-black tracking-wider">${db.title}</h1>
      ${db.badgeText ? `<span class="text-[10px] bg-accent-100/10 text-accent-400 px-2 py-0.5 rounded-full font-bold border border-accent-700/40 tracking-wide ml-2">${db.badgeText}</span>` : ''}
    </div>
  `;
}

function renderExternalLinks(db) {
  const container = document.getElementById('external-links');
  if (db.boothUrl) {
    container.innerHTML += `<a href="${db.boothUrl}" target="_blank" class="text-accent-400 hover:text-accent-300 font-bold underline decoration-dotted underline-offset-4">${db.boothText || 'シナリオはこちら→'}</a>`;
  }
  if (db.youtubeUrl) {
    container.innerHTML += `<a href="${db.youtubeUrl}" target="_blank" class="text-accent-400 hover:text-accent-300 font-bold underline decoration-dotted underline-offset-4">${db.youtubeText || '配信アーカイブはこちら→'}</a>`;
  }
}

async function init() {
  const params = new URLSearchParams(location.search);
  DB = DATABASES[params.get('id')];

  if (!DB) {
    document.getElementById('empty-msg').textContent = 'URLのid指定が正しくありません。一覧ページからアクセスしてください。';
    return;
  }

  applyAccentTheme(DB.accent);
  document.title = DB.title;
  renderHeader(DB);
  renderExternalLinks(DB);

  try {
    const apiUrl = new URL(GAS_URL);
    apiUrl.searchParams.append("sheet", DB.sheetName);

    const res = await fetch(apiUrl.toString(), { method: "GET", redirect: "follow" });
    if (!res.ok) throw new Error(`HTTPエラー: ${res.status}`);
    const data = await res.json();
    if (data.error) throw new Error(data.error);

    HEADERS = data.headers;
    ROWS = data.rows;
    renderCheckboxes();
    renderTable();
  } catch (err) {
    document.getElementById('empty-msg').textContent = 'データの取得に失敗しました: ' + err.message;
    console.error(err);
  }
}

function renderCheckboxes() {
  const container = document.getElementById('dist-checkboxes');
  const seen = new Set(), uniqueValues = [];
  ROWS.forEach(row => {
    const v = row[DB.distColIndex];
    if (v && !seen.has(v)) { seen.add(v); uniqueValues.push(v); }
  });

  uniqueValues.forEach(value => {
    const label = document.createElement('label');
    label.className = "flex items-center gap-1.5 cursor-pointer";
    label.innerHTML = `<input type="checkbox" value="${value}" class="accent-accent-500 w-4 h-4"> ${value}`;
    label.querySelector('input').addEventListener('change', (e) => {
      if (e.target.checked) checkedDist.add(value); else checkedDist.delete(value);
      syncSelectAll();
      renderTable();
    });
    container.appendChild(label);
  });

  document.getElementById('select-all').addEventListener('change', (e) => {
    container.querySelectorAll('input[type="checkbox"]').forEach(cb => {
      cb.checked = e.target.checked;
      if (e.target.checked) checkedDist.add(cb.value); else checkedDist.delete(cb.value);
    });
    renderTable();
  });
}

function syncSelectAll() {
  const all = document.querySelectorAll('#dist-checkboxes input[type="checkbox"]');
  document.getElementById('select-all').checked = [...all].every(cb => cb.checked);
}

function renderTable() {
  const head = document.getElementById('table-head');
  const body = document.getElementById('table-body');
  const emptyMsg = document.getElementById('empty-msg');
  head.innerHTML = ''; body.innerHTML = '';

  const hiddenStart = HEADERS.length - DB.hiddenColumnCount;

  HEADERS.forEach((h, i) => {
    const th = document.createElement('th');
    th.className = "py-3 px-4 whitespace-nowrap" + (i >= hiddenStart && !showHidden ? " hidden" : "");
    th.textContent = h;
    head.appendChild(th);
  });

  const visibleRows = ROWS.filter(row => checkedDist.has(row[DB.distColIndex]));
  emptyMsg.style.display = visibleRows.length === 0 ? 'block' : 'none';

  visibleRows.forEach(row => {
    const tr = document.createElement('tr');
    row.forEach((cell, i) => {
      const td = document.createElement('td');
      td.className = "py-3 px-4 whitespace-nowrap" + (i >= hiddenStart && !showHidden ? " hidden" : "");
      if (typeof cell === 'string' && cell.startsWith('http')) {
        td.innerHTML = `<a href="${cell}" target="_blank" class="text-accent-400 font-bold underline">リンク</a>`;
      } else {
        td.textContent = cell;
      }
      tr.appendChild(td);
    });
    body.appendChild(tr);
  });
}

document.getElementById('toggle-hidden').addEventListener('click', (e) => {
  showHidden = !showHidden;
  e.target.textContent = showHidden ? 'ネタバレを隠す' : 'ネタバレを表示';
  renderTable();
});

init();
</script>
</body>
</html>
